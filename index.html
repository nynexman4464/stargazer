<!DOCTYPE html>
<!-- data-theme / data-astryx-theme are set statically, per the
     Astryx Theme docs ('set data-theme on <html> ... to avoid a
     flash of wrong theme before hydration'): the Theme provider
     syncs these same attributes on mount, but until it did, the
     theme's @scope'd CSS and light-dark() tokens did not apply
     and cards painted transparent for a few frames on cold
     loads (Alex's screen recording, 2026-10-26). -->
<html lang="en" data-theme="dark" data-astryx-theme="stargazer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stargazer — Keep looking up.</title>
<meta name="description" content="What's worth looking up for: ISS flyovers, meteor showers, eclipses, aurora, planet pairings and comets — ranked for your sky.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-00VRF6YYJX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-00VRF6YYJX');
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
