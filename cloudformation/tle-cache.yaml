AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Stargazer TLE cache — a Lambda (fronted by a Function URL) that fetches
  ISS/Tiangong/Hubble TLEs from CelesTrak, caches them in S3, and refreshes
  on a 12-hour schedule. The static site reads the Function URL instead of
  hitting CelesTrak from the browser.

Resources:
  TleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'stargazer-tle-cache-${AWS::AccountId}'
      # Private bucket: only the Lambda touches it, via its IAM role.

  TleFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: tle-cache-s3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject']
                Resource: !Sub '${TleBucket.Arn}/tles.json'

  TleFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TleFunctionRole.Arn
      Timeout: 300
      MemorySize: 128
      Environment:
        Variables:
          BUCKET: !Ref TleBucket
          KEY: tles.json
      Code:
        ZipFile: |
          """TLE cache: serve tles.json from S3, refreshing from CelesTrak
          when the cached copy is older than 12h. Never overwrites the cache
          with invalid data; serves the stale copy rather than failing."""
          import json, os, time, urllib.request
          import boto3

          NORADS = [25544, 48274, 20580]  # ISS, Tiangong, Hubble
          BUCKET = os.environ['BUCKET']
          KEY = os.environ.get('KEY', 'tles.json')
          STALE_AFTER = 12 * 3600
          UA = {'User-Agent': 'Stargazer-tle-cache/1.0'}
          s3 = boto3.client('s3')

          def valid(lines, norad):
              if len(lines) != 3:
                  return False
              l1, l2 = lines[1].strip(), lines[2].strip()
              n = str(norad)
              return (l1.startswith('1 ') and l2.startswith('2 ')
                      and l1[2:7].strip() == n and l2[2:7].strip() == n
                      and len(l1) >= 69 and len(l2) >= 69)

          def fetch_tle(norad, attempts, timeout):
              url = ('https://celestrak.org/NORAD/elements/gp.php'
                     f'?CATNR={norad}&FORMAT=TLE')
              for a in range(attempts):
                  if a:
                      time.sleep(a * 10)
                  try:
                      req = urllib.request.Request(url, headers=UA)
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          text = r.read().decode('utf-8', 'replace')
                      cand = [s.strip() for s in text.splitlines() if s.strip()]
                      if valid(cand, norad):
                          return cand[1].strip(), cand[2].strip()
                      print(f'{norad}: invalid body ({len(text)} chars)')
                  except Exception as e:
                      print(f'{norad} attempt {a}: {e}')
              return None

          def refresh(thorough):
              attempts = 3 if thorough else 1
              tles = {}
              for norad in NORADS:
                  r = fetch_tle(norad, attempts, 20)
                  if not r:
                      return None
                  tles[str(norad)] = list(r)
                  time.sleep(5)  # be polite to CelesTrak
              return tles

          def read_cache():
              try:
                  o = s3.get_object(Bucket=BUCKET, Key=KEY)
                  body = json.loads(o['Body'].read())
                  age = time.time() - o['LastModified'].timestamp()
                  return body, age
              except Exception as e:
                  print('cache read:', e)
                  return None, None

          def handler(event, context):
              thorough = event.get('source') == 'aws.scheduler'
              body, age = read_cache()
              if body is None or age is None or age > STALE_AFTER:
                  fresh = refresh(thorough)
                  if fresh:
                      body = {'updated': time.strftime('%Y-%m-%dT%H:%M:%SZ',
                                                       time.gmtime()),
                              'tles': fresh, '_source': ['CelesTrak']}
                      s3.put_object(Bucket=BUCKET, Key=KEY,
                                    Body=json.dumps(body),
                                    ContentType='application/json')
                      print('cache refreshed')
                  elif body is None:
                      return _resp(503, {'error': 'TLE unavailable'})
              return _resp(200, body)

          def _resp(status, body):
              return {'statusCode': status,
                      'headers': {'Content-Type': 'application/json',
                                  'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps(body)}

  TleFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref TleFunction
      AuthType: NONE
      Cors:
        AllowOrigins: ['*']
        AllowMethods: ['GET']
        AllowHeaders: ['*']
        MaxAge: 86400

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-tle-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt TleFunction.Arn

  SchedulerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TleFunction
      Action: lambda:InvokeFunction
      Principal: scheduler.amazonaws.com
      SourceArn: !GetAtt TleRefreshSchedule.Arn

  TleRefreshSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: stargazer-tle-refresh
      Description: Refresh the Stargazer TLE cache in S3 every 12 hours.
      ScheduleExpression: 'rate(12 hours)'
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt TleFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

Outputs:
  FunctionUrl:
    Description: The HTTPS endpoint the site fetches TLEs from.
    Value: !GetAtt TleFunctionUrl.FunctionUrl
  BucketName:
    Description: S3 bucket holding the cached tles.json.
    Value: !Ref TleBucket
